name: Sync release versions

on:
  release:
    types: [published, edited, deleted, unpublished, released, prereleased]
  # Old release tags may predate this workflow, so their events cannot run it.
  # Reconcile from the default branch even when a release event is missed.
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches:
      - '**'
    paths:
      - 'tools/sync_versions.cjs'
      - 'tests/test_sync_versions.cjs'
      - '.github/workflows/sync-versions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release-versions
  cancel-in-progress: false

jobs:
  sync:
    # Releases point at tags; always publish the index to the default branch.
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Test the release index generator
        run: node --test tests/test_sync_versions.cjs

      - name: Build and publish versions.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            # Regenerate against current releases and sources after a racing push.
            git fetch --no-tags origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" FETCH_HEAD
            node tools/sync_versions.cjs
            git add -- versions.json
            if git diff --cached --quiet -- versions.json; then
              echo 'versions.json already matches the published releases.'
              exit 0
            fi
            git commit -m 'chore: sync release versions' -- versions.json
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying from the latest branch."
          done

          echo 'Could not publish versions.json. Check Actions write permissions and branch rules.' >&2
          exit 1
